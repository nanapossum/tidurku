# IP klien asli: di belakang Cloudflare pakai header CF-Connecting-IP,
# kalau kosong (akses lokal/LAN) pakai alamat koneksi langsung.
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# Rate limit: 10 permintaan/detik per IP (burst 20)
limit_req_zone $client_ip zone=api:10m rate=10r/s;
limit_req_status 429;

log_format tidurk_safe '$client_ip "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent $request_time';

server {
    listen 80;
    client_max_body_size 1m;
    client_body_timeout 10s;
    send_timeout 30s;
    access_log /var/log/nginx/access.log tidurk_safe;

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://core-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location = / {
        default_type application/json;
        return 200 '{"service":"tidurku","docs":"/api/docs"}';
    }
}
