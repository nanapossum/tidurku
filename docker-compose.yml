services:
  core-service:
    build: ./core-service
    restart: unless-stopped
    env_file: .env            # rahasia, jangan di-commit
    volumes:
      - ./data:/data          # database SQLite
    mem_limit: 256m           # jaga STB tidak hang
    cpus: 0.5

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - core-service
    mem_limit: 64m
